<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3557">
  <meta name="description" content="Passeport virtuel de la MRC des Basques : scannez les codes QR des attraits, accumulez des pistoles et débloquez des récompenses.">
  <title>Passeport virtuel – MRC des Basques</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="entete">
    <p class="kicker" id="mrc">MRC des Basques</p>
    <h1 id="titre">Passeport virtuel</h1>
  </header>

  <nav class="onglets" aria-label="Navigation principale">
    <button data-action="vue" data-vue="passeport">Passeport</button>
    <button data-action="vue" data-vue="scanner">Scanner</button>
    <button data-action="vue" data-vue="recompenses">Récompenses</button>
    <button data-action="vue" data-vue="admin">Admin</button>
  </nav>

  <main id="contenu" class="contenu" aria-live="polite"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-carte" role="dialog" aria-modal="true" aria-labelledby="modal-titre">
      <h2 id="modal-titre"></h2>
      <div id="modal-corps"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
