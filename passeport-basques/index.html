<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3557">
  <meta name="description" content="Passeport virtuel de la MRC des Basques : scannez les codes QR des attraits, accumulez des pistoles et débloquez des récompenses.">
  <title>Passeport virtuel – MRC des Basques</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Passeport">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="entete">
    <p class="kicker" id="mrc">MRC des Basques</p>
    <h1 id="titre">Passeport virtuel</h1>
  </header>

  <nav class="onglets" aria-label="Navigation principale">
    <button data-action="vue" data-vue="passeport">Passeport</button>
    <button data-action="vue" data-vue="scanner">Scanner</button>
    <button data-action="vue" data-vue="recompenses">Récompenses</button>
    <button data-action="vue" data-vue="admin">Admin</button>
  </nav>

  <section id="installation" class="installation" hidden aria-label="Installer l’application">
    <p><strong>Gardez le passeport sur votre téléphone.</strong> Installez-le pour le retrouver sur votre écran d’accueil, même hors ligne.</p>
    <div class="actions">
      <button id="btn-installer" hidden>Installer</button>
      <button id="btn-plus-tard" class="discret">Plus tard</button>
    </div>
    <p id="aide-ios" class="petit" hidden>Sur iPhone : touchez <strong>Partager</strong> (le carré avec la flèche), puis <strong>Sur l’écran d’accueil</strong>.</p>
  </section>

  <main id="contenu" class="contenu" aria-live="polite"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-carte" role="dialog" aria-modal="true" aria-labelledby="modal-titre">
      <h2 id="modal-titre"></h2>
      <div id="modal-corps"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
