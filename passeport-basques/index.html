<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3557">
  <meta name="description" content="Scannez les codes QR des attraits de la MRC des Basques et gardez la trace de vos visites.">
  <title>Passeport virtuel des Basques</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Passeport">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Courier+Prime:wght@400;700&family=EB+Garamond:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="encre" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="bruit"/>
      <feDisplacementMap in="SourceGraphic" in2="bruit" scale="2.5"/>
    </filter>
  </svg>
  <header class="entete">
    <img class="couverture-image" src="assets/couverture.jpg" alt="Illustration : Les Basques, Bas-Saint-Laurent, un traversier de nuit sous la lune" width="200" height="267">
    <p class="kicker" id="mrc">MRC des Basques</p>
    <h1 id="titre">Passeport virtuel</h1>
  </header>

  <nav class="onglets" aria-label="Navigation principale">
    <button data-action="vue" data-vue="passeport">Passeport</button>
    <button data-action="vue" data-vue="scanner">Scanner</button>
    <button data-action="vue" data-vue="recompenses">Récompenses</button>
    <button data-action="vue" data-vue="admin">Admin</button>
  </nav>

  <section id="installation" class="installation" hidden aria-label="Installer l’application">
    <p><strong>Ajoutez-le à votre téléphone.</strong> Vous le retrouverez sur votre écran d’accueil, même sans réseau.</p>
    <div class="actions">
      <button id="btn-installer" hidden>Installer</button>
      <button id="btn-plus-tard" class="discret">Plus tard</button>
    </div>
    <p id="aide-ios" class="petit" hidden>Sur iPhone, appuyez sur <strong>Partager</strong>, puis sur <strong>Sur l’écran d’accueil</strong>.</p>
  </section>

  <main id="contenu" class="contenu" aria-live="polite"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-carte" role="dialog" aria-modal="true" aria-labelledby="modal-titre">
      <h2 id="modal-titre"></h2>
      <div id="modal-corps"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
